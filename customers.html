<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | Veltrix Car Rental Management System</title>
  <meta name="description" content="Veltrix customer list with booking history, customer type (New, Regular, VIP), total bookings, total spending and status.">
  <meta name="keywords" content="car rental customers, customer booking history, VIP customers, Veltrix">
  <meta name="author" content="Veltrix">
  <meta name="theme-color" content="#13744a">
  <meta property="og:title" content="Customers — Veltrix">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("vx_theme") || "light");</script>
</head>
<body data-page="customers.html" data-title="Customers">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div><h1>Customers</h1><p>Customer profiles and rental history for administrative reference. All records are view-only.</p></div>
        <div class="actions">
          <button class="btn" id="exportBtn"><i class="bi bi-download"></i> Export CSV</button>
        </div>
      </div>

      <section class="grid grid-4" id="summary"></section>

      <section class="card mt-16">
        <div class="card-body">
          <div class="toolbar">
            <div class="input-icon search"><i class="bi bi-search"></i><input class="form-control" id="search" placeholder="Search name, email, phone or booking ID" aria-label="Search customers"></div>
            <select class="form-control" id="fType" aria-label="Filter by type"><option value="">All types</option><option>New</option><option>Regular</option><option>VIP</option></select>
            <select class="form-control" id="fStatus" aria-label="Filter by status"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select>
            <select class="form-control" id="sortBy" aria-label="Sort"><option value="spend">Sort: Highest spending</option><option value="bookings">Sort: Most bookings</option><option value="recent">Sort: Latest booking</option><option value="name">Sort: Name A–Z</option></select>
            <div class="segmented" role="group" aria-label="Change view" style="margin-left:auto">
              <button class="active" data-mode="table"><i class="bi bi-table"></i> Table</button>
              <button data-mode="cards"><i class="bi bi-person-vcard"></i> Cards</button>
            </div>
          </div>
          <p class="small muted mb-16" id="resultCount"></p>

          <div class="table-wrap" id="tableView">
            <table class="table">
              <thead><tr><th>Customer</th><th>Type</th><th>Latest booking</th><th>Vehicle</th><th>Rental dates</th><th class="num">Price</th><th class="num">Total bookings</th><th class="num">Total spending</th><th>Status</th></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="cust-grid hidden" id="cardView"></div>
        </div>
        <div class="card-foot muted"><i class="bi bi-eye"></i> View-only customer records. Customer type and activity status are calculated from existing rental history.</div>
      </section>
    </main>
    <footer id="footer"></footer>
  </div>

  <!-- History -->
  <div class="modal-backdrop" id="historyModal">
    <div class="modal lg" role="dialog" aria-modal="true" aria-labelledby="hmTitle">
      <div class="modal-head"><div style="display:flex;gap:12px;align-items:center"><span class="avatar lg" id="hmAvatar"></span><div><h2 id="hmTitle"></h2><p id="hmSub"></p></div></div><button class="icon-btn" data-close="historyModal" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
      <div class="modal-body" id="hmBody"></div>
      <div class="modal-foot" id="hmFoot"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/cars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
